name: NeeDoh stock watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Send a test alert
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: needoh-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TEST_ALERT: ${{ inputs.test }}
        run: python3 watch.py
      - name: Save stock state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "stock-watch"
            git config user.email "stock-watch@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state"
            git push
          fi
